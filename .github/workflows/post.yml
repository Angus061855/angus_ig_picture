name: Instagram 發文

on:
  schedule:
    - cron: '0 2 * * *'  # 台灣 16:00
    - cron: '0 4 * * *' # 台灣 18:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    name: Publish Instagram
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install Pillow requests cloudinary google-genai
          pip list | grep google

      - name: Publish Instagram only
        id: instagram
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python Instagram.py

      - name: Save published record for Facebook
        if: steps.instagram.outputs.notion_page_id != ''
        env:
          NOTION_PAGE_ID: ${{ steps.instagram.outputs.notion_page_id }}
        run: |
          mkdir -p work
          printf '%s' "$NOTION_PAGE_ID" > work/notion_page_id.txt
      - uses: actions/upload-artifact@v4
        if: steps.instagram.outputs.notion_page_id != ''
        with:
          name: published-notion-record
          path: work/notion_page_id.txt
          retention-days: 7
