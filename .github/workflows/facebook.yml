name: Facebook 發文

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '只檢查連線，或從 Facebook 資料庫發文'
        type: choice
        default: facebook_check
        options:
          - facebook_check
          - facebook_publish
      notion_page_id:
        description: '可留空隨機選待發文章；只接受 Facebook 資料庫的文章 ID'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: facebook-publish
  cancel-in-progress: false

jobs:
  facebook:
    name: Publish Facebook only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow requests cloudinary google-genai
      - name: Publish or check Facebook only
        env:
          PUBLISH_MODE: ${{ inputs.mode }}
          NOTION_PAGE_ID: ${{ inputs.notion_page_id }}
          FB_NOTION_DATABASE_ID: '40f11a31-6c9e-8003-9d73-e9a4456cdcc0'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python facebook.py
